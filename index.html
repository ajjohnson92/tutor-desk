<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<meta name="robots" content="noindex, nofollow">
<title>Tutor Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Tutor Desk's own colours (theme.py), dark and light */
:root, :root[data-theme="dark"] {
  --bg: #1e1f22; --surface: #2b2d31; --field: #313338; --border: #3f4147;
  --fg: #e8e9eb; --muted: #9ba1a9; --accent: #4c8bf5; --amber: #e0a040; --now: #ef4444;
  --c-fill: #24406b; --c-text: #dbe6fb; --c-line: #4c8bf5;
  --p-fill: #33294d; --p-text: #d6c9f7; --p-line: #9b7fe0;
  --d-fill: #1d3b2a; --d-text: #9fdcb2; --d-line: #2f6a47;
  --a-fill: #3a2c14; --a-text: #f7c27a; --a-line: #e0a040;
  --o-fill: #47263a; --o-text: #f8c8de; --o-line: #e889b5;
  --x-fill: #333438; --x-text: #c4c7cd; --x-line: #616161;
  --g-fill: #16393a; --g-text: #a7e3e0; --g-line: #2fb3ac;
}
:root[data-theme="light"] {
  --bg: #f5f5f4; --surface: #e9e9e7; --field: #ffffff; --border: #c9c9c6;
  --fg: #1f2328; --muted: #6b7280; --accent: #2563eb; --amber: #b45309; --now: #ef4444;
  --c-fill: #dbe6fb; --c-text: #1b2f55; --c-line: #213d64;
  --p-fill: #ece6fb; --p-text: #4a3486; --p-line: #9b7fe0;
  --d-fill: #dcf2e3; --d-text: #1d6b3a; --d-line: #43a047;
  --a-fill: #fdf0dc; --a-text: #8a4b08; --a-line: #e0a040;
  --o-fill: #fde3ef; --o-text: #8a2453; --o-line: #e889b5;
  --x-fill: #ececec; --x-text: #3a3a3a; --x-line: #616161;
  --g-fill: #dcf5f3; --g-text: #0f5753; --g-line: #2fb3ac;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); touch-action: pan-x pan-y; }  /* the page never zooms */
body { font: 14px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; min-height: 100vh;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:active { background: var(--field); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.muted { color: var(--muted); }
.hidden { display: none !important; }

/* top bar, like Tutor Desk's */
header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
header h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; }
.synced { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.synced .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.synced.stale { color: var(--amber); } .synced.stale .dot { background: var(--amber); }
.icon-btn { padding: 5px 9px; font-size: 16px; line-height: 1; }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { padding: 8px 16px; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0;
  color: var(--muted); background: none; }
.tab.on { color: var(--fg); background: var(--surface); border-color: var(--border); font-weight: 600;
  margin-bottom: -1px; }
main { padding: 10px 16px 24px; }

/* calendar toolbar */
.bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bar .week { font-weight: 600; flex: 1; min-width: 120px; text-align: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: none; border-radius: 0; background: var(--surface); padding: 6px 12px; }
.seg button.on { background: var(--accent); color: #fff; }
.info { font-size: 12px; margin: 6px 0 8px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
.days button { padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; }
.days button b { font-size: 15px; }
.days button.today { color: var(--accent); }
.days button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.days button .pip { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; }
.days button .pip.none { opacity: 0; }

/* the grid */
.cal { position: relative; border-top: 1px solid var(--border); user-select: none; touch-action: pan-x pan-y; }
.colheads { display: grid; margin-left: 44px; }
.colheads div { text-align: center; font-size: 12px; font-weight: 600; padding: 4px 0; }
.colheads div.today { color: var(--accent); }
.allday { margin-left: 44px; display: grid; gap: 0 2px; }
.allday .ad { font-size: 11px; margin: 1px 2px; padding: 1px 5px; border-radius: 3px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; background: var(--g-fill); color: var(--g-text);
  border: 1px solid var(--g-line); }
.hours { position: relative; }
.hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
.hour span { position: absolute; left: 0; top: 2px; width: 38px; text-align: right; font-size: 11px; color: var(--muted); }
.col { position: absolute; top: 0; bottom: 0; background: var(--surface); border-left: 1px solid var(--border); }
.col .work { position: absolute; left: 0; right: 0; background: var(--bg); }
.ev { position: absolute; border: 1px solid; border-radius: 4px; padding: 2px 4px; overflow: hidden;
  font-size: 12px; line-height: 1.25; cursor: pointer; }
.ev.dash { border-style: dashed; }
.ev small { display: block; opacity: .85; font-size: 11px; }
.v-week .ev { font-size: 10px; padding: 1px 2px; } .v-week .ev small { font-size: 9px; }
.v-3day .ev { font-size: 11px; padding: 2px 3px; } .v-3day .ev small { font-size: 10px; }
.now { position: absolute; height: 2px; background: var(--now); z-index: 3; }
.note { text-align: center; color: var(--muted); padding: 28px 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 10px; border: 1px solid; border-radius: 2px; display: inline-block; }

/* hours tracker */
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.card b { display: block; font-size: 20px; line-height: 1.2; }
.card span { font-size: 12px; color: var(--muted); }
.progress { position: relative; height: 10px; border-radius: 5px; background: var(--surface);
  border: 1px solid var(--border); margin: 0 0 4px; overflow: hidden; }
.progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--now); }
.progress em { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--fg); opacity: .7; }
.graph { margin-top: 14px; touch-action: pan-y; }
.graph svg { display: block; width: 100%; }
.legend .off { opacity: .35; text-decoration: line-through; }
.legend [data-y] { cursor: pointer; }
.weeks { margin-top: 16px; border-top: 1px solid var(--border); }
.wk { display: grid; grid-template-columns: 1fr 86px 46px; align-items: center; gap: 6px; padding: 6px 4px;
  border-bottom: 1px solid var(--border); }
.wk.head { font-weight: 600; font-size: 12px; }
.wk.cur { background: var(--field); }
.wk .chip { color: #fff; font-weight: 600; font-size: 13px; border-radius: 4px; padding: 2px 8px; text-align: left; }
.wk .tot { text-align: right; }
.wk .nt { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -2px; }

/* details sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; }
.sheet { background: var(--surface); border-top: 1px solid var(--border); width: 100%; border-radius: 12px 12px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h2 { font-size: 17px; margin: 6px 0 4px; }
.sheet .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
.sheet p { margin: 6px 0; }
.sheet .full { font-size: 12px; word-break: break-word; }

/* lock screen */
.lock { max-width: 380px; width: calc(100% - 32px); margin: 12vh auto 0; padding: 24px 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; text-align: center; }
.lock img { width: 64px; height: 64px; border-radius: 14px; }
.lock h1 { font-size: 20px; margin: 8px 0 4px; }
.lock input { width: 100%; margin: 14px 0 10px; padding: 10px; font: 600 17px/1 ui-monospace, Consolas, monospace;
  letter-spacing: 1px; text-align: center; background: var(--field); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; text-transform: uppercase; }
.lock input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.lock .err { color: var(--now); min-height: 1.3em; font-size: 13px; }
.lock button { width: 100%; padding: 10px; }
</style>
</head>
<body>
<div id="lock" class="lock hidden">
  <img src="icon-192.png" alt="">
  <h1>Tutor Desk</h1>
  <div class="muted">Enter your phone code. It's in Tutor Desk on your PC: Settings (the cog) → Phone view → Show code.</div>
  <form id="lockForm">
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX">
    <div class="err" id="lockErr"></div>
    <button class="primary" id="unlockBtn">Unlock</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Tutor Desk</h1>
    <div class="synced" id="synced"><span class="dot"></span><span id="syncedText"></span></div>
    <button class="icon-btn" id="reload" title="Check for a newer copy" aria-label="Check for a newer copy">↻</button>
  </header>
  <nav class="tabs"><button class="tab on" data-tab="cal">Calendar</button><button class="tab" data-tab="hours">Hours Tracker</button></nav>
  <main>
  <section id="calTab">
    <div class="bar">
      <button id="prev" aria-label="Previous">‹</button>
      <div class="week" id="weekLabel"></div>
      <button id="next" aria-label="Next">›</button>
      <button id="today">Today</button>
      <div class="seg"><button id="vDay">Day</button><button id="v3day">3 days</button><button id="vWeek">Week</button></div>
    </div>
    <div class="info muted" id="info"></div>
    <div class="days" id="days"></div>
    <div id="cal"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section id="hoursTab" class="hidden">
    <div class="bar">
      <select id="hYear" aria-label="Year"></select>
      <span style="flex:1"></span>
      <div class="seg"><button id="gYear">Whole year</button><button id="gSoFar">So far</button></div>
    </div>
    <div class="cards" id="hCards"></div>
    <div class="progress" id="hProgress"></div>
    <div id="hGraph" class="graph"></div>
    <div class="legend" id="hLegend"></div>
    <div class="weeks" id="hWeeks"></div>
    <div class="muted info" id="hHint"></div>
  </section>
  </main>
</div>
<div id="sheet" class="sheet-bg hidden"></div>

<script>
"use strict";
const KINDS = {
  "Confirmed": ["c", "Confirmed"], "Provisional": ["p", "Provisional"], "Completed": ["d", "Completed"],
  "Application Proposed Availability": ["a", "Offered in an application"],
  "Outlook Events (view only)": ["o", "Outlook"], "Other": ["x", "Other"], "Google": ["g", "Google Calendar"],
};
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const $ = (id) => document.getElementById(id);
const store = {  // localStorage can be unavailable (private tabs); the page still works without it
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let snap = null, view = store.get("view") || (innerWidth < 600 ? "day" : "week");
let weekStart = monday(new Date()), dayIdx = (new Date().getDay() + 6) % 7;

// ---- dates (all local; the snapshot's dates are UK dates as text)
function monday(d) { const m = new Date(d.getFullYear(), d.getMonth(), d.getDate()); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return m; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function parseIso(s) { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
function mins(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function hhmm(m) { return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; }
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);
function ago(s) {
  if (!s) return "never";
  const m = Math.floor((Date.now() - new Date(s)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} days ago`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

// ---- unlocking: the key is made from the code once, then kept (not the code) in this browser's IndexedDB
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function db() {
  return new Promise((ok, bad) => {
    const r = indexedDB.open("tutor-desk", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
  });
}
async function keyGet() {
  try { const d = await db(); return await new Promise((ok) => { const q = d.transaction("keys").objectStore("keys").get("key"); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); }
  catch (e) { return null; }
}
async function keyPut(v) {
  try { const d = await db(); await new Promise((ok) => { const t = d.transaction("keys", "readwrite"); t.objectStore("keys").put(v, "key"); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {}
}
async function makeKey(code, locked) {
  const raw = new TextEncoder().encode(code.toUpperCase().replace(/[^A-Z0-9]/g, ""));
  const base = await crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(locked.salt), iterations: locked.iter},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
}
async function unlock(key, locked) {
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(locked.iv)}, key, b64(locked.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function fetchLocked() {
  const r = await fetch(`snapshot.json?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status === 503 ? "offline" : `HTTP ${r.status}`);
  return r.json();
}

let locked = null;
async function start() {
  try { locked = await fetchLocked(); }
  catch (e) { return showLock("Couldn't download your calendar" + (e.message === "offline" ? " - no signal, and nothing saved yet." : ` (${e.message}).`)); }
  const saved = await keyGet();
  if (saved && saved.salt === locked.salt) {
    try { return show(await unlock(saved.key, locked)); } catch (e) { /* the code changed: ask again */ }
  }
  showLock("");
}
function showLock(msg) {
  $("app").classList.add("hidden"); $("lock").classList.remove("hidden");
  $("lockErr").textContent = msg;
}
$("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!locked) return start();
  $("unlockBtn").disabled = true; $("lockErr").textContent = "";
  try {
    const key = await makeKey($("code").value, locked);
    const data = await unlock(key, locked);
    await keyPut({salt: locked.salt, key});
    $("code").value = "";
    show(data);
  } catch (err) { $("lockErr").textContent = "That code didn't unlock it - check it in Tutor Desk and try again."; }
  $("unlockBtn").disabled = false;
});

// ---- showing it
function show(data) {
  snap = data;
  document.documentElement.dataset.theme = data.theme === "light" ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
  const age = (Date.now() - new Date(data.synced || data.made)) / 3600000;
  $("synced").classList.toggle("stale", age > 48);
  $("syncedText").textContent = data.synced ? `Synced ${ago(data.synced)}` : `Updated ${ago(data.made)}`;
  showTab(tab);
}

// ---- tabs
let tab = store.get("tab") === "hours" ? "hours" : "cal";
function showTab(t) {
  tab = t; store.set("tab", t);
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  $("calTab").classList.toggle("hidden", t !== "cal");
  $("hoursTab").classList.toggle("hidden", t !== "hours");
  if (!snap) return;
  if (t === "cal") draw(); else { scrollTo(0, 0); drawHours(); }
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));

// ---- the Hours Tracker: same numbers, colours and graph as the tab in Tutor Desk
const CELL = {red: "#c62828", orange: "#e08a00", green: "#2e7d32", current: "#616161"};
const LINE_COLOURS = ["#5b8def", "#f08c3a", "#9e9e9e", "#f2c230", "#a07be0", "#3fb2a8", "#e889b5"];
let hYear = null, graphMode = store.get("graph") || "year";
const hidden = new Set();
$("hYear").addEventListener("change", () => { hYear = +$("hYear").value; drawHours(); });
$("gYear").addEventListener("click", () => { graphMode = "year"; store.set("graph", graphMode); drawHours(); });
$("gSoFar").addEventListener("click", () => { graphMode = "sofar"; store.set("graph", graphMode); drawHours(); });
const g1 = (v) => String(Math.round(v * 10) / 10);

function drawHours() {
  const H = snap.hours;
  if (!H || !H.years.length) { $("hCards").innerHTML = `<div class="muted">Hours aren't in this copy yet - sync again in Tutor Desk.</div>`; return; }
  const cfg = H.settings, years = H.years;
  if (hYear === null || !years.some((y) => y.start_year === hYear)) hYear = H.current;
  $("hYear").innerHTML = [...years].reverse().map((y) => `<option value="${y.start_year}" ${y.start_year === hYear ? "selected" : ""}>${y.label}</option>`).join("");
  const year = years.find((y) => y.start_year === hYear) || years[years.length - 1];
  const rows = year.rows;

  // summary, as above the table in Tutor Desk
  const worked = rows.reduce((t, r) => t + (r.hours ?? 0), 0);
  const weeksLeft = rows.filter((r) => r.hours === null || r.current).length;
  const card = (big, small) => `<div class="card"><b>${big}</b><span>${small}</span></div>`;
  let cards = card(`${g1(worked)} h`, "worked") + card(`${g1(cfg.target)} h`, "target");
  if (worked >= cfg.target) cards += card(`${g1(worked - cfg.target)} h`, "over target");
  else {
    cards += card(`${g1(cfg.target - worked)} h`, "to go");
    if (weeksLeft && !year.imported) cards += card(`${((cfg.target - worked) / weeksLeft).toFixed(1)} h`,
      `a week for ${g1(cfg.target)} · ${(Math.max(0, cfg.stretch - worked) / weeksLeft).toFixed(1)} for ${g1(cfg.stretch)}`);
  }
  $("hCards").innerHTML = cards;
  $("hProgress").innerHTML = `<i style="width:${Math.min(100, worked / cfg.stretch * 100)}%"></i><em style="left:${cfg.target / cfg.stretch * 100}%"></em>`;
  $("hProgress").title = `${g1(worked)} of ${g1(cfg.stretch)} h (line at ${g1(cfg.target)})`;
  $("gYear").classList.toggle("on", graphMode === "year"); $("gSoFar").classList.toggle("on", graphMode === "sofar");

  drawGraph(years, cfg, H.current);

  // the weeks, newest first (weeks still to come are left out)
  let total = 0;
  const done = rows.filter((r) => r.hours !== null).map((r) => ({...r, total: (total += r.hours)}));
  $("hWeeks").innerHTML = `<div class="wk head"><span>Week</span><span>Hours</span><span class="tot">Total</span></div>` +
    done.reverse().map((r) => {
      const col = r.current ? CELL.current : CELL[r.hours >= cfg.green ? "green" : r.hours >= cfg.orange ? "orange" : "red"];
      return `<div class="wk ${r.current ? "cur" : ""}"><span>${fmt(parseIso(r.start), {weekday: "short", day: "2-digit", month: "short"})}</span>` +
        `<span class="chip" style="background:${col}">${g1(r.hours)}${r.edited ? " ✎" : ""}${r.current ? " so far" : ""}</span>` +
        `<span class="tot">${g1(r.total)}</span>${r.note ? `<span class="nt">${esc(r.note)}</span>` : ""}</div>`;
    }).join("");
  $("hHint").textContent = year.imported ? "From your Hours Target Tracker spreadsheet."
    : "Added up from your transcripts in Tutor Desk (✎ = corrected by hand there).";
}

function drawGraph(years, cfg, current) {
  const box = $("hGraph"), w = box.clientWidth || 340, h = Math.round(Math.min(320, Math.max(220, w * 0.7)));
  const series = years.map((y, k) => {
    let run = 0; const pts = [];
    for (const r of y.rows) { if (r.hours === null) break; run += r.hours; pts.push(run); }
    return {y, pts, colour: y.start_year === current ? "var(--now)" : LINE_COLOURS[k % LINE_COLOURS.length]};
  });
  const nWeeks = Math.max(53, ...years.map((y) => y.rows.length));
  let x1 = nWeeks - 1, yTop = Math.max(cfg.stretch * 1.05, 1000, ...series.map((s) => Math.max(0, ...s.pts)));
  if (graphMode === "sofar") {  // zoom in on the weeks up to now (plus a few)
    const now = (series.find((s) => s.y.start_year === current) || series[series.length - 1]).pts.length;
    x1 = Math.min(nWeeks - 1, Math.max(8, now + 3));
    const inRange = series.filter((s) => !hidden.has(s.y.start_year)).flatMap((s) => s.pts.slice(0, x1 + 1));
    yTop = Math.max(50, ...inRange, cfg.stretch * x1 / nWeeks) * 1.1;
  }
  const L = 40, R = 8, T = 8, B = 22, pw = w - L - R, ph = h - T - B;
  const gx = (i) => L + i / x1 * pw, gy = (v) => T + (1 - v / yTop) * ph;
  const step = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000].find((s) => s >= yTop / 6);
  let s = `<svg viewBox="0 0 ${w} ${h}" height="${h}"><defs><clipPath id="plot"><rect x="${L}" y="${T}" width="${pw}" height="${ph}"/></clipPath></defs>`;
  for (let v = 0; v <= yTop; v += step) {
    s += `<line x1="${L}" x2="${w - R}" y1="${gy(v)}" y2="${gy(v)}" stroke="var(--border)"/>` +
      `<text x="${L - 6}" y="${gy(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  }
  for (let m = 0; m < 12; m++) {  // month names along the bottom, Sep..Aug
    const d = new Date(2026 + Math.floor((8 + m) / 12), (8 + m) % 12, 1);
    const i = (d - new Date(2026, 8, 1)) / 6048e5;
    if (i <= x1) s += `<text x="${gx(i)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${"Sep Oct Nov Dec Jan Feb Mar Apr May Jun Jul Aug".split(" ")[m]}</text>`;
  }
  s += `<g clip-path="url(#plot)">`;
  for (const se of series) {
    if (se.pts.length < 2 || hidden.has(se.y.start_year)) continue;
    const thick = se.y.start_year === current ? 3.5 : se.y.start_year === hYear ? 2.5 : 1.6;
    s += `<polyline fill="none" stroke="${se.colour}" stroke-width="${thick}" stroke-linejoin="round" points="${se.pts.map((v, i) => `${gx(i).toFixed(1)},${gy(v).toFixed(1)}`).join(" ")}"/>`;
  }
  s += `<line x1="${L}" x2="${w - R}" y1="${gy(cfg.target)}" y2="${gy(cfg.target)}" stroke="#bdbdbd" stroke-dasharray="2 4"/>` +
    `<line x1="${gx(0)}" y1="${gy(cfg.stretch / nWeeks)}" x2="${gx(nWeeks - 1)}" y2="${gy(cfg.stretch)}" stroke="var(--now)" stroke-dasharray="2 4" stroke-width="2"/></g></svg>`;
  box.innerHTML = s;
  $("hLegend").innerHTML = series.filter((se) => se.pts.length >= 2).map((se) =>
    `<span data-y="${se.y.start_year}" class="${hidden.has(se.y.start_year) ? "off" : ""}"><i style="background:${se.colour};border-color:${se.colour};height:${se.y.start_year === current ? 4 : 2}px"></i>${se.y.label}</span>`).join("") +
    `<span><i style="border:none;border-top:2px dashed #bdbdbd;height:0"></i>${g1(cfg.target)} target</span>` +
    `<span><i style="border:none;border-top:2px dotted var(--now);height:0"></i>${g1(cfg.stretch)} target</span>`;
  $("hLegend").querySelectorAll("[data-y]").forEach((el) => el.addEventListener("click", () => {
    const y = +el.dataset.y; hidden.has(y) ? hidden.delete(y) : hidden.add(y); drawHours();
  }));
}
$("reload").addEventListener("click", () => { $("syncedText").textContent = "Checking..."; start(); });
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("today").addEventListener("click", () => { weekStart = monday(new Date()); dayIdx = (new Date().getDay() + 6) % 7; draw(true); });
const VIEW_BTN = {day: "vDay", "3day": "v3day", week: "vWeek"};
for (const [v, id] of Object.entries(VIEW_BTN)) $(id).addEventListener("click", () => { view = v; store.set("view", view); draw(true); });
function step(n) {  // a week at a time in Week, three days in 3 days, one day in Day
  const cur = addDays(weekStart, dayIdx + n * (view === "week" ? 7 : view === "3day" ? 3 : 1));
  weekStart = monday(cur); dayIdx = (cur.getDay() + 6) % 7;
  draw();
}
// one finger: swipe left / right to move a day (or three, or a week); two fingers: pinch up and down to
// stretch or squash the hours, keeping the time between your fingers where it is
// (while pinching the hours are just stretched on screen; they're redrawn properly when you let go, because
// redrawing under your fingers would stop the touch)
let touch = null, pinch = null, zoomY = +(store.get("zoomY") || 1);
const gap = (e) => Math.max(30, Math.abs(e.touches[0].clientY - e.touches[1].clientY));
const mid = (e) => (e.touches[0].clientY + e.touches[1].clientY) / 2;
$("cal").addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    touch = null;
    const hours = e.target.closest && e.target.closest(".hours");  // only a pinch on the hours themselves
    if (!hours) return;
    const y = mid(e) - hours.getBoundingClientRect().top;
    pinch = {hours, gap: gap(e), zoom: zoomY, z: zoomY, y, minute: draw.first * 60 + y / draw.hourH * 60, at: mid(e)};
    hours.style.transformOrigin = `0 ${y}px`;
  } else if (e.touches.length === 1 && !pinch) touch = [e.touches[0].clientX, e.touches[0].clientY];
}, {passive: true});
$("cal").addEventListener("touchmove", (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();  // the page itself doesn't zoom
  pinch.z = Math.min(3, Math.max(0.4, pinch.zoom * gap(e) / pinch.gap));
  pinch.hours.style.transform = `translateY(${mid(e) - pinch.at}px) scaleY(${pinch.z / pinch.zoom})`;
  pinch.at2 = mid(e);
}, {passive: false});
// two fingers anywhere else on the page do nothing (no page zoom; only the calendar's hours stretch)
document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
$("cal").addEventListener("touchcancel", (e) => { touch = null; if (pinch) $("cal").dispatchEvent(new TouchEvent("touchend")); });
$("cal").addEventListener("touchend", (e) => {
  if (pinch) {
    if (e.touches.length < 2) {  // let go: redraw at the new size, with the pinched time still under your fingers
      const p = pinch;
      pinch = null;
      zoomY = p.z;
      store.set("zoomY", String(zoomY));
      draw(false);
      const hours = $("cal").querySelector(".hours");
      scrollTo(0, Math.max(0, hours.getBoundingClientRect().top + scrollY + (p.minute / 60 - draw.first) * draw.hourH - (p.at2 ?? p.at)));
    }
    return;
  }
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch[0], dy = e.changedTouches[0].clientY - touch[1];
  touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
});

function lanes(events) {  // side by side for overlapping entries, as in the Calendar tab
  const out = []; let group = [], groupEnd = -1, ends = [];
  const sorted = [...events].sort((a, b) => mins(a.start) - mins(b.start) || b.minutes - a.minutes);
  for (const e of sorted) {
    const s = mins(e.start), f = s + Math.max(e.minutes, 20);
    if (s >= groupEnd && group.length) { group.forEach(([g, l]) => out.push([g, l, ends.length])); group = []; ends = []; }
    let lane = ends.findIndex((end) => end <= s);
    if (lane < 0) { ends.push(f); lane = ends.length - 1; } else ends[lane] = f;
    group.push([e, lane]);
    groupEnd = group.length > 1 ? Math.max(groupEnd, f) : f;
  }
  group.forEach(([g, l]) => out.push([g, l, ends.length]));
  return out;
}

function draw(scroll) {
  if (!snap) return;
  const today = iso(new Date()), sun = addDays(weekStart, 6);
  const week = [...Array(7)].map((_, i) => iso(addDays(weekStart, i)));
  const shown = view === "week" ? week : [...Array(view === "3day" ? 3 : 1)].map((_, i) => iso(addDays(weekStart, dayIdx + i)));
  for (const [v, id] of Object.entries(VIEW_BTN)) $(id).classList.toggle("on", view === v);
  const short = {day: "numeric", month: "short"};
  $("weekLabel").textContent = view === "week"
    ? `${fmt(weekStart, short)} – ${fmt(sun, {...short, year: "numeric"})}`
    : view === "3day" ? `${fmt(parseIso(shown[0]), short)} – ${fmt(parseIso(shown[2]), short)}`
    : innerWidth >= 420 ? fmt(parseIso(shown[0]), {weekday: "long", day: "numeric", month: "long", year: "numeric"})
    : fmt(parseIso(shown[0]), {weekday: "long", day: "numeric", month: "long"});
  const read = snap.weeks_read[iso(weekStart)];
  const unread = shown.filter((d) => !snap.weeks_read[iso(monday(parseIso(d)))]);
  $("info").textContent = (read ? `This week read from the portal ${ago(read)}` : "This week hasn't been read from the portal")
    + (snap.google_fetched ? ` · Google ${ago(snap.google_fetched)}` : "") + ` · copied to phone ${ago(snap.made)}`;

  const dates = new Set([...week, ...shown]);  // 3 days can run into next week
  const timed = snap.events.filter((e) => dates.has(e.date)).map((e) => ({...e, src: "portal"}))
    .concat(snap.google.filter((e) => dates.has(e.date) && !e.all_day).map((e) => ({...e, src: "google", kind: "Google", name: e.title})));
  const allDay = snap.google.filter((e) => e.all_day && shown.includes(e.date));

  // the day picker (Day and 3 days)
  $("days").classList.toggle("hidden", view === "week");
  $("days").innerHTML = week.map((d, i) => {
    const has = timed.some((e) => e.date === d) || snap.google.some((e) => e.date === d && e.all_day);
    return `<button data-i="${i}" class="${shown.includes(d) ? "on" : ""} ${d === today ? "today" : ""}">${DAYS[i]}<b>${parseIso(d).getDate()}</b><span class="pip ${has ? "" : "none"}"></span></button>`;
  }).join("");
  $("days").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { dayIdx = +b.dataset.i; draw(); }));

  const inView = timed.filter((e) => shown.includes(e.date));
  const span = view === "week" ? timed : inView;  // the hours shown: 07:00-21:00, stretched to fit what's there
  const first = Math.floor(Math.min(7 * 60, ...span.map((e) => mins(e.start))) / 60);
  const last = Math.ceil(Math.max(21 * 60, ...span.map((e) => mins(e.start) + e.minutes)) / 60);
  const hourH = (view === "week" ? 40 : 52) * zoomY, gutter = 44, n = shown.length;
  draw.first = first; draw.hourH = hourH;  // for pinching
  const y = (m) => (m / 60 - first) * hourH;
  const colW = `((100% - ${gutter}px) / ${n})`;
  const colLeft = (i) => `calc(${gutter}px + ${colW} * ${i})`;

  let h = "";
  if (n > 1) {
    h += `<div class="colheads" style="grid-template-columns:repeat(${n},1fr)">` + shown.map((d) => {
      const name = DAYS[(parseIso(d).getDay() + 6) % 7];
      return `<div class="${d === today ? "today" : ""}">${name.slice(0, n === 7 && innerWidth < 420 ? 1 : 3)} ${parseIso(d).getDate()}</div>`;
    }).join("") + `</div>`;
  }
  if (allDay.length) {
    h += `<div class="allday" style="grid-template-columns:repeat(${n},minmax(0,1fr))">` + shown.map((d) =>
      `<div>${allDay.filter((e) => e.date === d).map((e) =>
        `<div class="ad" data-g="${esc(e.title)}" data-d="${d}">${esc(e.title)}</div>`).join("")}</div>`).join("") + `</div>`;
  }
  h += `<div class="hours" style="height:${(last - first) * hourH + 4}px">`;
  shown.forEach((d, i) => {
    const wh = snap.working_hours[DAYS[parseIso(d).getDay() === 0 ? 6 : parseIso(d).getDay() - 1]];
    h += `<div class="col" style="left:${colLeft(i)};width:calc(${colW})">` +
      (wh ? `<div class="work" style="top:${Math.max(0, y(mins(wh[0])))}px;height:${y(mins(wh[1])) - Math.max(0, y(mins(wh[0])))}px"></div>` : "") + `</div>`;
  });
  for (let hr = first; hr <= last; hr++) h += `<div class="hour" style="top:${y(hr * 60)}px">${hr < last ? `<span>${String(hr).padStart(2, "0")}:00</span>` : ""}</div>`;
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  const ti = shown.indexOf(today);
  if (ti >= 0 && nowM >= first * 60 && nowM <= last * 60) h += `<div class="now" style="top:${y(nowM)}px;left:${colLeft(ti)};width:calc(${colW})"></div>`;
  const items = [];
  shown.forEach((d, i) => {
    for (const [e, lane, nl] of lanes(inView.filter((x) => x.date === d))) {
      const [k] = KINDS[e.kind] || KINDS.Other, s = mins(e.start);
      const top = y(s) + 1, height = Math.max(16, y(s + e.minutes) - y(s) - 2);
      const left = `calc(${colLeft(i)} + 3px + (${colW} - 6px) / ${nl} * ${lane})`;
      const width = `calc((${colW} - 6px) / ${nl} - ${nl > 1 ? 2 : 0}px)`;
      const dash = e.kind === "Provisional" || e.kind === "Application Proposed Availability";
      const detail = e.src === "portal" ? [e.subject, e.job].filter(Boolean).join(" · ") : "";
      items.push(e);
      h += `<div class="ev ${dash ? "dash" : ""}" data-n="${items.length - 1}" style="top:${top}px;height:${height}px;left:${left};width:${width};` +
        `background:var(--${k}-fill);color:var(--${k}-text);border-color:var(--${k}-line)">${e.start} ${esc(e.name)}` +
        (detail && height > 34 ? `<small>${esc(detail)}</small>` : "") + `</div>`;
    }
  });
  h += `</div>`;
  if (unread.length && parseIso(unread[unread.length - 1]) >= monday(new Date())) h += `<div class="note">${view === "week" ? "This week hasn't" : unread.length === n ? "These days haven't" : "Some of these days haven't"} been read from the portal yet - Sync everything in Tutor Desk reads ahead.</div>`;
  else if (unread.length) h += `<div class="note">Weeks before last week aren't kept.</div>`;
  else if (!inView.length && !allDay.length) h += `<div class="note">Nothing in your calendar ${view === "week" ? "this week" : view === "3day" ? "these three days" : "this day"}.</div>`;

  const cal = $("cal");
  cal.className = `cal v-${view}`;
  cal.innerHTML = h;
  cal.querySelectorAll(".ev").forEach((el) => el.addEventListener("click", () => details(items[+el.dataset.n])));
  cal.querySelectorAll(".allday [data-g]").forEach((el) => el.addEventListener("click", () =>
    details({src: "google", kind: "Google", date: el.dataset.d, title: el.dataset.g, all_day: true})));
  $("legend").innerHTML = Object.entries(KINDS).filter(([kind]) => kind !== "Other").map(([, [k, label]]) =>
    `<span><i style="background:var(--${k}-fill);border-color:var(--${k}-line)"></i>${label}</span>`).join("");
  if (scroll !== false && tab === "cal") {  // start at the current time (or the first lesson)
    const target = ti >= 0 ? nowM - 90 : Math.min(...inView.map((e) => mins(e.start)), 9 * 60) - 30;
    const top = cal.querySelector(".hours").getBoundingClientRect().top + scrollY + y(Math.max(first * 60, target)) - 120;
    if (scroll === true || !draw.scrolled) { scrollTo({top: Math.max(0, top), behavior: draw.scrolled ? "smooth" : "auto"}); draw.scrolled = true; }
  }
}

function details(e) {
  const [k, label] = KINDS[e.kind] || KINDS.Other, d = parseIso(e.date);
  const when = e.all_day ? "all day" : `${e.start}–${hhmm(mins(e.start) + e.minutes)}`;
  const body = e.src === "portal"
    ? `<h2>${esc(e.name)}</h2>${e.subject ? `<p>${esc(e.subject)}</p>` : ""}${e.job ? `<p class="muted">${esc(e.job)}</p>` : ""}<p class="full muted">${esc(e.title)}</p>`
    : `<h2>${esc(e.title)}</h2>`;
  $("sheet").innerHTML = `<div class="sheet"><div class="muted">${fmt(d, {weekday: "long", day: "numeric", month: "long"})} · ${when}</div>` +
    `<span class="kind" style="background:var(--${k}-fill);color:var(--${k}-text);border-color:var(--${k}-line)">${label}</span>${body}` +
    `<button style="width:100%;margin-top:10px" id="closeSheet">Close</button></div>`;
  $("sheet").classList.remove("hidden");
  $("closeSheet").addEventListener("click", () => $("sheet").classList.add("hidden"));
}
$("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").classList.add("hidden"); });
addEventListener("resize", () => { if (snap) tab === "hours" ? drawHours() : draw(false); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && snap) start(); });
setInterval(() => { if (snap && !document.hidden) draw(false); }, 60000);  // keeps the time line and "ago" moving

document.documentElement.dataset.theme = store.get("theme") || "dark";
if ("serviceWorker" in navigator) {
  // when Tutor Desk has uploaded a new version of this page, reload once to show it (not on the very first visit)
  const hadOne = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadOne) location.reload(); });
  navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
}
start();
</script>
</body>
</html>
